<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SCCシミュレーター（仮称）</title>
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<header class="app-header">
  <h1>SCCシミュレーター<span class="tentative">（仮称）</span></h1>
  <span class="version">版 <span id="version"></span></span>
</header>

<main class="app">
  <section class="panel start">
    <button id="start" type="button" class="start-button">▶ 音を出す</button>
    <p id="start-note" class="note">押すと音が出ます。最初は小さめの音量（0.3）です。</p>
  </section>

  <section class="panel status" aria-live="polite">
    <h2>状態</h2>
    <dl>
      <div><dt>音</dt><dd id="audio-state">止まっています</dd></div>
      <div><dt>MIDI</dt><dd><span id="midi-state">まだ確認していません</span> <button id="midi-retry" type="button" class="small" hidden>もう一度試す</button></dd></div>
      <div><dt>処理の重さ</dt><dd><span id="load">—</span> <span id="underrun" class="warn" hidden>音切れの疑い</span></dd></div>
    </dl>
    <p id="error" class="error" hidden></p>
  </section>

  <section class="panel volume">
    <h2><label for="master">音量</label></h2>
    <div class="row">
      <input id="master" type="range" min="0" max="1" step="0.01" value="0.3" disabled>
      <output id="master-value" for="master">0.30</output>
    </div>
  </section>

  <section class="panel waves">
    <h2>波形</h2>
    <div id="wave-buttons" class="wave-buttons" role="radiogroup" aria-label="プリセット波形"></div>
  </section>

  <section class="panel channels">
    <h2>チャンネル</h2>
    <table>
      <thead><tr><th>ch</th><th>周波数</th><th>音量</th><th>キー</th><th>波形</th></tr></thead>
      <tbody id="channel-rows"></tbody>
    </table>
  </section>

  <section class="panel keyboard-panel">
    <div class="kb-head">
      <h2>鍵盤</h2>
      <p class="kb-status" aria-live="off">重さ <span id="load-kb">—</span>（最大 <span id="load-max">—</span>）・発音 <span id="voices-kb">0</span> <span id="underrun-kb" class="warn" hidden>音切れの疑い</span></p>
    </div>
    <div class="row octave">
      <button id="oct-down" type="button" class="small" disabled aria-label="1オクターブ下げる">◀ 低く</button>
      <span id="octave-label"></span>
      <button id="oct-up" type="button" class="small" disabled aria-label="1オクターブ上げる">高く ▶</button>
    </div>
    <div id="keyboard" class="keyboard" aria-label="画面の鍵盤" aria-disabled="true"></div>
  </section>
</main>

<footer class="app-footer">
  <a href="notice.html">ライセンス表示</a>
  <label class="font-compare">書体（比較用）
    <select id="font-select">
      <option value="a">A：OS標準</option>
      <option value="b">B：UDゴシック系</option>
      <option value="c">C：等幅</option>
    </select>
  </label>
</footer>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
